name: Eco Grid frontend CI
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Frontend build
        run: npm run build
